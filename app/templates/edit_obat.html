<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Edit Obat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
        }
        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 12px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #0056b3;
        }
        .flash {
            margin-top: 10px;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }
        .flash.error {
            background-color: #ffe0e0;
            color: #cc0000;
        border: 1px solid #cc0000;
        }
    </style>
</head>
<body>
    <div class="container">
      <h2>Edit Obat</h2>
      <form method="POST">
        <label for="nama">Nama Obat:</label>
        <input type="text" id="nama" name="nama" value="{{ obat.nama }}" required>
  
        <label for="kategori">Kategori:</label>
        <input type="text" id="kategori" name="kategori" value="{{ obat.kategori }}" required>
  
        <label for="satuan">Satuan:</label>
        <input type="text" id="satuan" name="satuan" value="{{ obat.satuan }}" required>
  
        <label for="harga">Harga:</label>
        <input type="number" id="harga" name="harga" value="{{ obat.harga }}" min="1" max="99999" step="1" required>
  
        <label for="stok">Stok:</label>
        <input type="number" id="stok" name="stok" value="{{ obat.stok }}" min="1" max="99999" step="1" required>
  
        <label for="tanggal_kadaluarsa">Tanggal Kadaluarsa:</label>
        <input type="date" id="tanggal_kadaluarsa" name="tanggal_kadaluarsa" value="{{ obat.tanggal_kadaluarsa.strftime('%Y-%m-%d') }}" required>
  
        <button type="submit">Simpan</button>
      </form>
    </div>
  </body>
  
</html>
