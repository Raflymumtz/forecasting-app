<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background-color: #fff;
  font-family: Arial, sans-serif;
}

/* CONTAINER UTAMA */
.login-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 60px;
}

/* LOGO */
.logo {
  margin-bottom: 10px;
}

.logo img {
  width: 420px;
  height: auto;
}

/* LOGIN BOX */
.login-box {
  width: 100%;
  max-width: 380px;
  background: white;
  border: 1px solid #eee;
  border-radius: 6px;
  padding: 30px;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
}

/* JUDUL LOGIN */
.login-box h4 {
  color: #28a745;
  font-size: 18px;
  margin-bottom: 20px;
  text-align: center;
}

/* LABEL */
label {
  font-weight: bold;
  font-size: 14px;
  display: block;
  margin-bottom: 5px;
}

/* FORM INPUT */
input[type="text"],
input[type="password"] {
  width: 100%;
  padding: 10px;
  border: 1px solid #ddd;
  background-color: #eaf2ff;
  border-radius: 4px;
  margin-bottom: 15px;
  font-size: 14px;
}

/* TOMBOL */
button.btn {
  width: 100%;
  padding: 12px;
  background-color: #0096f4;
  color: white;
  font-size: 16px;
  font-weight: bold;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  margin-top: 10px;
}

button.btn:hover {
  background-color: #007dd4;
}

/* LINK BAWAH */
.links {
  margin-top: 10px;
  display: flex;
  justify-content: space-between;
}

.links a {
  font-size: 14px;
  text-decoration: none;
  color: #0096f4;
}

.links a:hover {
  text-decoration: underline;
}

/* FOOTER */
.footer-links {
  margin-top: 30px;
  text-align: center;
  font-size: 13px;
  color: #888;
}

.footer-links a {
  color: #888;
  text-decoration: none;
  margin: 0 5px;
}

.footer-links a:hover {
  text-decoration: underline;
}

.sidebar-header {
  display: flex;
  justify-content: center;
  align-items: center; /* ini yang memastikan vertikal center */
  gap: 10px; /* beri jarak antara teks dan logo */
}

.sidebar-title {
  font-size: 18px;
  font-weight: bold;
  white-space: nowrap;
  margin: 0;
}
    </style>
</head>
<body>

<div class="login-container">
  <div class="sidebar-header">
    <span class="sidebar-title">RS XYZ</span>
    <img src="{{ url_for('static', filename='icons/rs.gif') }}" width="40">
  </div>

    <div class="login-box">
        <h4>Silahkan masuk ke akun anda</h4>
      
        <form method="POST">
          <label for="username">Email / Username</label>
          <input type="text" id="username" name="username" required>
      
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
      
          <button type="submit" class="btn">Masuk</button>
        </form>
      
        <div class="links">
          <a href="{{ url_for('auth.register') }}">Register</a>
          <a href="#">Lupa password?</a>
        </div>
      </div>

    <div class="footer-links">
        <a href="#">Ketentuan Penggunaan</a> |
        <a href="#">Kebijakan Privasi</a>
    </div>
</div>

</body>
</html>
